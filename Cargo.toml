[package]
name = "oms"
version = "0.9.0"
edition = "2024"
description = "Pick an Omarchy theme for Ghostty and a matching macOS wallpaper from one TUI"
license = "MIT"
repository = "https://github.com/Mr-Sunglasses/oms"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
# Only the formats oms reads: JPEG and PNG wallpapers, plus WebP and GIF for
# your own. (The defaults also build AVIF, EXR, TIFF and more, which are slow
# to compile.)
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
# Already built for crossterm and ratatui-image; used directly for local time,
# the user id and signal handling instead of running `date` and `id`.
libc = "0.2.190"
# Already built for ratatui-image (same version and features), so it adds
# nothing to compile; picks random themes and wallpapers.
rand = "0.8.5"
ratatui = "0.30.2"
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# macOS only: main.rs stops other builds with a clear error.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
plist = "1.10.1"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every unsafe block says why it's sound.
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"
# Terminal geometry converts small, positive cell and pixel counts between
# integer and float types all the time; these casts can't overflow here.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
# oms is an app, not a library: there's no public API to document or mark.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
