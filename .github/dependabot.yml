# Weekly dependency updates, grouped into one pull request per ecosystem.
# The Rust toolchain itself is pinned in rust-toolchain.toml and bumped by hand.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
