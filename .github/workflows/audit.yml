name: Audit

# Checks Cargo.lock against the RustSec advisory database: weekly, so a new
# advisory shows up between releases, and whenever the lockfile changes.
on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths: [Cargo.lock]
  pull_request:
    paths: [Cargo.lock]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit dependencies
        run: cargo audit
