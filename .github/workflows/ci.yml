name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Install script
        # macOS runners don't ship shellcheck; Ubuntu runners do.
        run: |
          command -v shellcheck >/dev/null || brew install shellcheck
          bash -n install.sh && shellcheck install.sh
      - name: Website theme count
        # site/build.py keeps index.html's theme count in step with themes.json.
        if: runner.os == 'Linux'
        run: |
          python3 - <<'PY'
          import json, re
          count = len(json.load(open("site/themes.json")))
          html = open("site/index.html").read()
          found = set(re.findall(r"Omarchy's (\d+) themes|<b>(\d+) Omarchy themes</b>", html))
          numbers = {int(n) for pair in found for n in pair if n}
          assert numbers == {count}, f"index.html says {numbers}, themes.json has {count}; run site/build.py"
          PY
